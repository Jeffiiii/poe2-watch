[project]
name = "poe2-watch"
version = "0.1.0"
description = "Recording tools, V-JEPA 2 feature extraction and three-signal evaluation for the watching line"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.6",
  "torchvision",
  "transformers>=4.53",
  "numpy",
  "pillow",
  "imagehash",
  "opencv-python-headless",
  "scikit-learn",
  "tqdm",
  "huggingface-hub",
  "librosa",
  "soundfile",
  "rapidocr-onnxruntime",
  "google-genai",
  "python-dotenv",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
